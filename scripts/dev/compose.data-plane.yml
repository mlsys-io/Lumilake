# Bundled data plane for Lumilake e2e demos. Managed independently of
# `lumilake deploy`. See docs/E2E_DEMO.md for the full flow.

services:
  postgres:
    image: postgres:18
    container_name: lumilake-data-postgres
    environment:
      POSTGRES_USER: lumilake
      POSTGRES_PASSWORD: lumilake_password
      POSTGRES_DB: lumilake
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - lumilake-data-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumilake -d lumilake"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lumilake-data-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lumilake
      MINIO_ROOT_PASSWORD: lumilake_password
    ports:
      - "127.0.0.1:19100:9000"
      - "127.0.0.1:19101:9001"
    volumes:
      - lumilake-data-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    container_name: lumilake-data-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 lumilake lumilake_password
        mc mb --ignore-existing local/lumilake-demo
    restart: "no"

  lumid-data:
    image: ${LUMID_DATA_IMAGE:-ghcr.io/mlsys-io/lumid-data:latest}
    container_name: lumilake-data-lumid
    profiles: ["lumid"]
    environment:
      LUMID_DATA_API_KEY: ${LUMID_DATA_API_KEY:-}
      LUMID_DATA_DATABASE_URL: postgresql://lumilake:lumilake_password@postgres:5432/lumilake
      LUMID_DATA_S3_URL: s3://lumilake:lumilake_password@minio:9000/lumilake-demo
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lumilake-data-pg:
  lumilake-data-minio:
