[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmesh-sdk"
version = "0.1.10rc1"
description = "FlowMesh Python SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "pyyaml>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
