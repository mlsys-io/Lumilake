name: agent-retrieval-demo

# Five-aspect equity research workflow driven by lumid.data /agent/v1.
#
# Five data-agent calls (NL-to-SQL via the lumid.data agent) replace the
# five hand-written SQL/S3 ops from the social-network workflow:
#
#   1. Fundamentals    — quarterly income/balance/cashflow + ratios + profile
#   2. Insider         — monthly insider sentiment + transaction stats
#   3. Market          — hourly OHLC bars + 52-week metrics
#   4. News List       — 10 most recent news rows (metadata)
#   5. News Article    — single most-recent article with full body text
#
# Five aggregate reports + 2 personalities × 2 debate rounds = 10 LLM nodes

inputs:
  Stock: []

ops:
  # ────────────────────────── Stage 1: planner ──────────────────────────
  - id: "SQL Date Planner"
    op: LLMChatOp
    inputs: [Stock]
    prompt:
      template: "Generate one start_date for symbol {ref0}. The start_date is the inclusive lower-bound date used by the Market, Insider, News List, and News Article retrievals. Return a practical YYYY-MM-DD lookback date roughly 24 months back from today."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a SQL date planner. Produce exactly one structured field named start_date."
      - role: user
        content: ""
    structural_outputs:
      - name: start_date
        type: datetime
        min: "2024-01-01"
        max: "2025-12-31"
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  # ──────────────────── Stage 2: 5 data-agent retrievals ─────────────────
  - id: "Fundamentals via Agent"
    op: DataRetrievalOp
    inputs: ["Stock"]
    data_spec:
      type: agent
      schema_scope: >-
        demo.company_profile,
        demo.financial_income_statement,
        demo.financial_balance_sheet,
        demo.financial_cash_flow,
        demo.company_peer
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "Show me {ref_stock}'s last 10 quarters of fundamentals and key financial-health ratios."
      params:
        - label: ref_stock
          node: Stock
  - id: "Insider via Agent"
    op: DataRetrievalOp
    inputs: ["Stock", "SQL Date Planner"]
    data_spec:
      type: agent
      schema_scope: >-
        demo.insider_sentiment,
        demo.insider_transactions
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "Monthly insider activity for {ref_stock} over the 24 months ending {ref_start_date}, with 3-month rolling sentiment + transaction signals."
      params:
        - label: ref_stock
          node: Stock
        - label: ref_start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  - id: "Market via Agent"
    op: DataRetrievalOp
    inputs: ["Stock", "SQL Date Planner"]
    data_spec:
      type: agent
      schema_scope: >-
        demo.market_bars,
        demo.market_metrics
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "Hourly market activity for {ref_stock} since {ref_start_date} alongside 52-week and trailing return / valuation metrics."
      params:
        - label: ref_stock
          node: Stock
        - label: ref_start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  - id: "News List via Agent"
    op: DataRetrievalOp
    inputs: ["Stock", "SQL Date Planner"]
    data_spec:
      type: agent
      schema_scope: 'demo.news_metadata'
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "Up to 10 most recent news items for {ref_stock} since {ref_start_date}."
      params:
        - label: ref_stock
          node: Stock
        - label: ref_start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  - id: "News Article via Agent"
    op: DataRetrievalOp
    inputs: ["Stock", "SQL Date Planner"]
    data_spec:
      type: agent
      schema_scope: 'demo.news_metadata'
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "The single most recent news article for {ref_stock} since {ref_start_date}, with its body text."
      params:
        - label: ref_stock
          node: Stock
        - label: ref_start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  # ────────────────── Stage 3: 5 aspect-specific reports ─────────────────
  - id: "Fundamentals Report"
    op: LLMChatOp
    inputs: [Stock, "Fundamentals via Agent"]
    prompt:
      template: "Fundamentals analysis for {ref0}.\n\nUse the integrated SQL evidence below.\n\n{df}\n\nReturn a structured report with sections: Summary, Financial Strength, Profitability, Risks, Open Questions."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a careful financial analyst. Be specific, cite the data provided, and clearly separate facts from assumptions."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "Fundamentals via Agent"
        path: items.table
      - label: sql
        node: "Fundamentals via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "Insider Report"
    op: LLMChatOp
    inputs: [Stock, "Insider via Agent"]
    prompt:
      template: "Insider activity analysis for {ref0}.\n\nUse the monthly insider evidence below.\n\n{df}\n\nReturn a structured report with sections: Summary, Sentiment Trend, Transaction Pressure, Risks, Open Questions."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a careful financial analyst. Be specific, cite the data provided, and clearly separate facts from assumptions."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "Insider via Agent"
        path: items.table
      - label: sql
        node: "Insider via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "Market Report"
    op: LLMChatOp
    inputs: [Stock, "Market via Agent"]
    prompt:
      template: "Market analysis for {ref0}.\n\nUse the integrated market evidence below.\n\n{df}\n\nAnalyze price action, momentum, volatility, and technical signals. Call out notable moves and potential catalysts.\n\nReturn a structured report with sections: Summary, Key Signals, Risks, Open Questions."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a careful financial analyst. Be specific, cite the data provided, and clearly separate facts from assumptions."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "Market via Agent"
        path: items.table
      - label: sql
        node: "Market via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "News List Report"
    op: LLMChatOp
    inputs: [Stock, "News List via Agent"]
    prompt:
      template: "News digest for {ref0}.\n\nThe most recent 10 news items are:\n\n{df}\n\nProduce a structured report with sections: Summary, Key Developments, Themes, Open Questions."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a careful financial analyst. Be specific and cite the news provided."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "News List via Agent"
        path: items.table
      - label: sql
        node: "News List via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "News Article Brief"
    op: LLMChatOp
    inputs: [Stock, "News Article via Agent"]
    prompt:
      template: "Read the most recent news article body for {ref0} and produce a one-paragraph executive brief.\n\n{df}\n\nFocus on: what happened, why it matters, who's affected, and any forward-looking implication. Keep it under 150 words."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are a careful financial analyst. Cite the article specifically and separate facts from interpretation."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "News Article via Agent"
        path: items.table
      - label: sql
        node: "News Article via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  # ───────────────── Stage 4: 2 personalities × 2 rounds ─────────────────
  - id: "Bull Researcher R1"
    op: LLMChatOp
    inputs:
      - Stock
      - "Fundamentals Report"
      - "Insider Report"
      - "Market Report"
      - "News List Report"
      - "News Article Brief"
    prompt:
      template: "You are debating {ref0} stock. Inputs:\n\n**Fundamentals**\n{ref1}\n\n**Insider activity**\n{ref2}\n\n**Market**\n{ref3}\n\n**News digest**\n{ref4}\n\n**Latest article brief**\n{ref5}\n\nDeliver a strong evidence-based bullish argument grounded in those reports."
      format_kwargs:
        ref0: Stock
        ref1: "Fundamentals Report"
        ref2: "Insider Report"
        ref3: "Market Report"
        ref4: "News List Report"
        ref5: "News Article Brief"
    messages:
      - role: system
        content: "You are a Bull Analyst advocating for the stock. Build a strong, evidence-based case. Cite specifics from the reports. Be conversational, not list-mode."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "Bear Researcher R1"
    op: LLMChatOp
    inputs:
      - Stock
      - "Fundamentals Report"
      - "Insider Report"
      - "Market Report"
      - "News List Report"
      - "News Article Brief"
    prompt:
      template: "You are debating {ref0} stock. Inputs:\n\n**Fundamentals**\n{ref1}\n\n**Insider activity**\n{ref2}\n\n**Market**\n{ref3}\n\n**News digest**\n{ref4}\n\n**Latest article brief**\n{ref5}\n\nDeliver a strong evidence-based bearish argument grounded in those reports."
      format_kwargs:
        ref0: Stock
        ref1: "Fundamentals Report"
        ref2: "Insider Report"
        ref3: "Market Report"
        ref4: "News List Report"
        ref5: "News Article Brief"
    messages:
      - role: system
        content: "You are a Bear Analyst making the case against the stock. Be conversational, cite specifics, and avoid list-mode."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "Bull Researcher R2"
    op: LLMChatOp
    inputs: ["Bull Researcher R1", "Bear Researcher R1"]
    prompt:
      template: "Last round arguments:\n\n**Bull**\n{ref0}\n\n**Bear**\n{ref1}\n\nRefute the bear's claims and continue your bullish case."
      format_kwargs:
        ref0: "Bull Researcher R1"
        ref1: "Bear Researcher R1"
    messages:
      - role: system
        content: "You are a Bull Analyst. Engage directly with the bear's points. Stay grounded in the prior reports."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

  - id: "Bear Researcher R2"
    op: LLMChatOp
    inputs: ["Bull Researcher R1", "Bear Researcher R1"]
    prompt:
      template: "Last round arguments:\n\n**Bull**\n{ref0}\n\n**Bear**\n{ref1}\n\nRefute the bull's claims and continue your bearish case."
      format_kwargs:
        ref0: "Bull Researcher R1"
        ref1: "Bear Researcher R1"
    messages:
      - role: system
        content: "You are a Bear Analyst. Engage directly with the bull's points. Stay grounded in the prior reports."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

outputs:
  - name: bull_final
    ref: "Bull Researcher R2"
  - name: bear_final
    ref: "Bear Researcher R2"
