name: market-data-dynamic

# Dynamic workflow over real market data. The user supplies a plaintext GOAL;
# each round the planner (LLM) emits a small acyclic subgraph of ops that
# advances the goal, the server runs it, observes the result, and feeds the
# accumulated observations back to the planner. The planner stops when the
# evidence is sufficient.
#
# This example is a genuine multi-round analysis: round 1 emits a broad query
# (list all sectors with avg market cap), observes the result, and identifies a
# cluster (e.g. "semiconductors are the outlier"). Round 2 emits a subgraph
# diving into that specific cluster (e.g. "top 10 semiconductor peers by market
# cap"), referencing the cluster discovered in round 1. Round 2's subgraph
# cannot be written in advance — it depends on round 1's result.
#
# Inputs:  Symbols=["NVDA"] (exactly one symbol per dynamic run)
# Output:  archived planner plan for each round; each round's leaf results are
#          archived under `leaf_<node>` outputs.
#
# Runtime requirements:
#   - LUMID_DATA_URL must point at a lumid-data service exposing the
#     `reference` schema (e.g. https://lum.id/data), with LUMID_DATA_TOKEN
#     (or the LUMILAKE_RUNTIME_TOKEN fallback) for auth.
#   - A FlowMesh worker serving Qwen/Qwen3-8B for the planner.
#   - The normal Lumilake S3 archive configuration for submitted plans.
#
# Submit:
#   uv run python -c "from lumilake import LumilakeClient; c=LumilakeClient(base_url='http://127.0.0.1:9000'); yaml_text=open('examples/templates/yaml/market-data-dynamic.yaml').read(); print(c.jobs.submit({'data': [{'name': 'demo', 'workflow': yaml_text, 'inputs': {'Symbols': ['NVDA']}, 'output_location': {'type': 's3', 'prefix': 'dynamic/market/'}}]}, workflow_format='dynamic'))"

goal: >-
  Analyze the market-cap distribution across sectors for the given symbol's
  industry. First list all sectors with their average market cap, identify the
  outlier cluster, then dive into the top peers within that cluster. Stop when
  you have identified the outlier sector and its top peers by market cap.

driver:
  model: Qwen/Qwen3-8B
  max_rounds: 4
  max_nodes_per_round: 4
  output_location:
    type: s3
    prefix: dynamic/market/

# Reference library: pre-configured op templates the planner can emit by id.
# An emitted op references one with {"ref": "<id>", "id": <unique>, "inputs":
# [...]}; the template fills in the rest. The planner may override id and
# inputs (a matching "op" is asserted, not stored) — the template is
# authoritative for its config. A retrieval template's inputs wire its declared
# param slots in order, so the planner can point a {placeholder} at a prior
# node purely through inputs.
library:
  sector_market_cap:
    op: DataRetrievalOp
    data_spec:
      type: lumid
      mode: sql
      output_format: jsonl
      verify: false
      template: |-
        SELECT sector, AVG(market_cap) AS avg_market_cap
        FROM reference.profile
        GROUP BY sector
        ORDER BY avg_market_cap DESC
  top_peers:
    op: DataRetrievalOp
    data_spec:
      type: lumid
      mode: sql
      output_format: jsonl
      verify: false
      template: |-
        SELECT symbol, peer_symbol, market_cap
        FROM reference.peers
        WHERE symbol = {symbol}
        ORDER BY market_cap DESC
        LIMIT 10
      params:
        - label: symbol
          node: Symbols
      param_bindings:
        - label: symbol
          input: 0
  profile:
    op: DataRetrievalOp
    data_spec:
      type: lumid
      mode: sql
      output_format: jsonl
      verify: false
      template: |-
        SELECT symbol, name, sector, industry, employees, market_cap
        FROM reference.profile
        WHERE symbol = {symbol}
      params:
        - label: symbol
          node: Symbols
      param_bindings:
        - label: symbol
          input: 0
