  # ---- Stage 6: Debate history aggregation (LambdaOp) ------------------
  - id: "Debate History"
    op: LambdaOp
    inputs:
      - "Bull Researcher R1"
      - "Bear Researcher R1"
      - "Bull Researcher R2"
      - "Bear Researcher R2"
      - "Bull Researcher R3"
      - "Bear Researcher R3"
    fn_name: Debate_History
    code: |-
      def Debate_History(args):
          bull_r1, bear_r1, bull_r2, bear_r2, bull_r3, bear_r3 = args
          rounds = [(bull_r1, bear_r1), (bull_r2, bear_r2), (bull_r3, bear_r3)]
          lines = []
          for idx, (bull, bear) in enumerate(rounds, start=1):
              lines.append(f"\n## Round {idx}")
              if bull:
                  lines.append(f"**Bull Researcher:** {bull}")
              if bear:
                  lines.append(f"**Bear Researcher:** {bear}")
          return "\n".join(lines)

