name: trading-agent

# Trading agent demo: SQL + news image vision + bull/bear single-round
# debate + risk synthesis + final verdict.
#
# Models (all non-gated):
#   text   = Qwen/Qwen3-8B
#   vision = Qwen/Qwen3-VL-8B-Instruct
#
# Inputs:  Stock=["NVDA","AAPL",...]
# Output:  final_recommendation = {verdict: BUY|SELL|HOLD, rationale}
#
# Schema setup (one-shot; produced via scripts/dev/load_demo_data.sh):
#   lumilake_demo.instrument_profile          (company / sector / market cap / beta)
#   lumilake_demo.financial_income_statement  (quarterly revenue / net income / eps)
#   lumilake_demo.ohlc_10m                    (10-minute candles)
#   lumilake_demo.market_metrics              (52w high/low, peTTM, etc.)
#   lumilake_demo.news_metadata               (news article ids + summary)
# News PNGs live at s3://<bucket>/example-data/news/images/{news_metadata.id}.png.

inputs:
  Stock: []

ops:
  # ---- Stage 1: SQL date planner -------------------------------------

  - id: "SQL Date Planner"
    op: LLMChatOp
    inputs: [Stock]
    messages:
      - role: system
        content: "You are a SQL date planner. Produce exactly one structured field named start_date."
      - role: user
        content: "Pick a single lookback start_date that yields ~24 months of trailing data. Return YYYY-MM-DD."
    structural_outputs:
      - name: start_date
        type: datetime
        min: "2023-01-01"
        max: "2025-12-31"
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 2: SQL retrievals ---------------------------------------

  - id: "Fundamentals Query"
    op: DataRetrievalOp
    inputs: [Stock, "SQL Date Planner"]
    data_spec:
      type: sql
      connection_string: ${DATABASE_URL}
      template: |-
        WITH profile AS (
          SELECT symbol, "companyName", sector, industry, "marketCap", beta
          FROM lumilake_demo.instrument_profile
          WHERE symbol = '{symbol}'
          LIMIT 1
        ),
        income_recent AS (
          SELECT
            symbol,
            AVG(revenue) AS avg_revenue,
            AVG("netIncome") AS avg_net_income,
            AVG(eps) AS avg_eps,
            MAX(date::date)::text AS latest_report
          FROM lumilake_demo.financial_income_statement
          WHERE symbol = '{symbol}'
            AND date::date >= '{start_date}'::date
          GROUP BY symbol
        )
        SELECT
          p.symbol,
          p."companyName" AS company_name,
          p.sector,
          p.industry,
          p."marketCap" AS market_cap,
          p.beta,
          COALESCE(i.avg_revenue, 0) AS avg_revenue,
          COALESCE(i.avg_net_income, 0) AS avg_net_income,
          COALESCE(i.avg_eps, 0) AS avg_eps,
          i.latest_report
        FROM profile p
        LEFT JOIN income_recent i ON i.symbol = p.symbol;
      params:
        - label: symbol
          node: "Stock"
        - label: start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  - id: "Market Query"
    op: DataRetrievalOp
    inputs: [Stock, "SQL Date Planner"]
    data_spec:
      type: sql
      connection_string: ${DATABASE_URL}
      template: |-
        WITH bars_recent AS (
          SELECT
            symbol,
            MAX(high) AS recent_high,
            MIN(low) AS recent_low,
            AVG(close) AS recent_close_avg,
            SUM(volume) AS total_volume,
            MAX(timestamp)::text AS latest_ts
          FROM lumilake_demo.ohlc_10m
          WHERE symbol = '{symbol}'
            AND timestamp >= '{start_date}'::timestamp
          GROUP BY symbol
        ),
        metrics AS (
          SELECT symbol, metric::jsonb AS m
          FROM lumilake_demo.market_metrics
          WHERE symbol = '{symbol}'
          ORDER BY version DESC
          LIMIT 1
        )
        SELECT
          b.symbol,
          b.latest_ts,
          b.recent_high,
          b.recent_low,
          b.recent_close_avg,
          b.total_volume,
          m.m ->> '52WeekHigh'     AS week52_high,
          m.m ->> '52WeekLow'      AS week52_low,
          m.m ->> 'beta'           AS beta,
          m.m ->> 'peTTM'          AS pe_ttm,
          m.m ->> 'epsGrowthTTMYoy' AS eps_growth_ttm
        FROM bars_recent b
        LEFT JOIN metrics m ON m.symbol = b.symbol;
      params:
        - label: symbol
          node: "Stock"
        - label: start_date
          node: "SQL Date Planner"
          path: items.output.start_date

  - id: "News Query"
    op: DataRetrievalOp
    inputs: [Stock]
    data_spec:
      type: sql
      connection_string: ${DATABASE_URL}
      template: |-
        SELECT
          symbol,
          STRING_AGG(title, ' | ' ORDER BY "publishedDate" DESC) AS headlines,
          STRING_AGG(
            LEFT(COALESCE(summary, text, ''), 200),
            ' || ' ORDER BY "publishedDate" DESC
          ) AS synopses,
          COUNT(*) AS news_count
        FROM (
          SELECT *
          FROM lumilake_demo.news_metadata
          WHERE symbol = '{symbol}'
            AND id IS NOT NULL
          ORDER BY "publishedDate" DESC
          LIMIT 5
        ) recent
        GROUP BY symbol;
      params:
        - label: symbol
          node: "Stock"

  # ---- Stage 3: News per-article text summary ------------------------

  # ---- Stage 4: Bull / Bear single-round debate ----------------------

  - id: "Bull Researcher"
    op: LLMChatOp
    inputs: [Stock, "Fundamentals Query", "Market Query", "News Query"]
    prompt:
      template: "Argue the BUY case for {ref0}. Cite the figures below.\n\n{df}\n\nReturn thesis (paragraph), confidence (0-1), catalysts (comma-separated)."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are the bull analyst. Argue the BUY case using the data aggregated below. Cite specific figures. Address obvious bear counters preemptively."
      - role: user
        content: ""
    aggregate_table:
      - label: company_name
        node: "Fundamentals Query"
        path: items.table.company_name
      - label: avg_revenue
        node: "Fundamentals Query"
        path: items.table.avg_revenue
      - label: avg_net_income
        node: "Fundamentals Query"
        path: items.table.avg_net_income
      - label: avg_eps
        node: "Fundamentals Query"
        path: items.table.avg_eps
      - label: recent_close_avg
        node: "Market Query"
        path: items.table.recent_close_avg
      - label: week52_high
        node: "Market Query"
        path: items.table.week52_high
      - label: week52_low
        node: "Market Query"
        path: items.table.week52_low
      - label: pe_ttm
        node: "Market Query"
        path: items.table.pe_ttm
      - label: headlines
        node: "News Query"
        path: items.table.headlines
    structural_outputs:
      - name: thesis
        type: string
      - name: confidence
        type: number
        min: 0
        max: 1
      - name: catalysts
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  - id: "Bear Researcher"
    op: LLMChatOp
    inputs: [Stock, "Fundamentals Query", "Market Query", "News Query"]
    prompt:
      template: "Argue the SELL case for {ref0}. Cite the figures below.\n\n{df}\n\nReturn thesis (paragraph), confidence (0-1), risks (comma-separated)."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are the bear analyst. Argue the SELL case using the data aggregated below. Cite specific figures. Address obvious bull counters preemptively."
      - role: user
        content: ""
    aggregate_table:
      - label: company_name
        node: "Fundamentals Query"
        path: items.table.company_name
      - label: avg_revenue
        node: "Fundamentals Query"
        path: items.table.avg_revenue
      - label: avg_net_income
        node: "Fundamentals Query"
        path: items.table.avg_net_income
      - label: avg_eps
        node: "Fundamentals Query"
        path: items.table.avg_eps
      - label: recent_close_avg
        node: "Market Query"
        path: items.table.recent_close_avg
      - label: week52_high
        node: "Market Query"
        path: items.table.week52_high
      - label: week52_low
        node: "Market Query"
        path: items.table.week52_low
      - label: pe_ttm
        node: "Market Query"
        path: items.table.pe_ttm
      - label: headlines
        node: "News Query"
        path: items.table.headlines
    structural_outputs:
      - name: thesis
        type: string
      - name: confidence
        type: number
        min: 0
        max: 1
      - name: risks
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 5: Round 2 — rebuttal on each other's case --------------

  - id: "Bull Rebuttal"
    op: LLMChatOp
    inputs: [Stock, "Bull Researcher", "Bear Researcher"]
    prompt:
      template: "Refine the BUY case for {ref0}. Rebut the bear's strongest points and reinforce the thesis.\n\n{df}\n\nReturn thesis (paragraph), confidence (0-1), catalysts (comma-separated)."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are the bull analyst answering the bear in round 2. Sharpen your case."
      - role: user
        content: ""
    aggregate_table:
      - label: bull_thesis
        node: "Bull Researcher"
        path: items.output.thesis
      - label: bull_catalysts
        node: "Bull Researcher"
        path: items.output.catalysts
      - label: bear_thesis
        node: "Bear Researcher"
        path: items.output.thesis
      - label: bear_risks
        node: "Bear Researcher"
        path: items.output.risks
    structural_outputs:
      - name: thesis
        type: string
      - name: confidence
        type: number
        min: 0
        max: 1
      - name: catalysts
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  - id: "Bear Rebuttal"
    op: LLMChatOp
    inputs: [Stock, "Bull Researcher", "Bear Researcher"]
    prompt:
      template: "Refine the SELL case for {ref0}. Rebut the bull's strongest points and reinforce the risks.\n\n{df}\n\nReturn thesis (paragraph), confidence (0-1), risks (comma-separated)."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are the bear analyst answering the bull in round 2. Sharpen your case."
      - role: user
        content: ""
    aggregate_table:
      - label: bull_thesis
        node: "Bull Researcher"
        path: items.output.thesis
      - label: bull_catalysts
        node: "Bull Researcher"
        path: items.output.catalysts
      - label: bear_thesis
        node: "Bear Researcher"
        path: items.output.thesis
      - label: bear_risks
        node: "Bear Researcher"
        path: items.output.risks
    structural_outputs:
      - name: thesis
        type: string
      - name: confidence
        type: number
        min: 0
        max: 1
      - name: risks
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 6: Risk identification + synthesis ----------------------

  - id: "Risk Identifier"
    op: LLMChatOp
    inputs: [Stock, "Bull Rebuttal", "Bear Rebuttal"]
    prompt:
      template: "Enumerate the discrete risks raised by the bull and bear cases for {ref0}.\n\n{df}\n\nReturn risks (comma-separated list) and severity (low|medium|high)."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You are the risk identifier. List concrete, distinct risks; do not synthesize yet."
      - role: user
        content: ""
    aggregate_table:
      - label: bull_thesis
        node: "Bull Rebuttal"
        path: items.output.thesis
      - label: bull_catalysts
        node: "Bull Rebuttal"
        path: items.output.catalysts
      - label: bear_thesis
        node: "Bear Rebuttal"
        path: items.output.thesis
      - label: bear_risks
        node: "Bear Rebuttal"
        path: items.output.risks
    structural_outputs:
      - name: risks
        type: string
      - name: severity
        type: string
        enum: ["low", "medium", "high"]
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  - id: "Risk Synthesis"
    op: LLMChatOp
    inputs: [Stock, "Bull Rebuttal", "Bear Rebuttal", "Risk Identifier"]
    prompt:
      template: "Weigh the round-2 bull/bear cases and the identified risks for {ref0} below.\n\n{df}\n\nReturn balanced_view (paragraph), expected_value (number; positive = lean BUY, negative = lean SELL), guardrails (comma-separated stop/hedge conditions)."
      format_kwargs:
        ref0: Stock
    aggregate_table:
      - label: bull_thesis
        node: "Bull Rebuttal"
        path: items.output.thesis
      - label: bull_confidence
        node: "Bull Rebuttal"
        path: items.output.confidence
      - label: bear_thesis
        node: "Bear Rebuttal"
        path: items.output.thesis
      - label: bear_confidence
        node: "Bear Rebuttal"
        path: items.output.confidence
      - label: risks
        node: "Risk Identifier"
        path: items.output.risks
      - label: severity
        node: "Risk Identifier"
        path: items.output.severity
    messages:
      - role: system
        content: "You are the head of risk. Weigh the round-2 bull/bear cases and the identified risks."
      - role: user
        content: ""
    structural_outputs:
      - name: balanced_view
        type: string
      - name: expected_value
        type: number
      - name: guardrails
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  - id: "Fund Manager Verdict"
    op: LLMChatOp
    inputs: [Stock, "Risk Synthesis"]
    prompt:
      template: "You are the fund manager. Read the head-of-risk synthesis for {ref0} below.\n\n{df}\n\nOutput verdict (BUY|SELL|HOLD) and a rationale of at most two sentences."
      format_kwargs:
        ref0: Stock
    aggregate_table:
      - label: balanced_view
        node: "Risk Synthesis"
        path: items.output.balanced_view
      - label: expected_value
        node: "Risk Synthesis"
        path: items.output.expected_value
      - label: guardrails
        node: "Risk Synthesis"
        path: items.output.guardrails
    messages:
      - role: system
        content: "You are the fund manager. Output the decisive call. Do not default to HOLD unless strongly justified by the synthesis."
      - role: user
        content: ""
    structural_outputs:
      - name: verdict
        type: string
        enum: ["BUY", "SELL", "HOLD"]
      - name: rationale
        type: string
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

outputs:
  - name: final_recommendation
    ref: "Fund Manager Verdict"
