name: image-generation

# Render an investment-themed infographic from recent news.
#
#   1. SQL retrieval — top-5 news rows for the stock
#   2. S3 retrieval  — per-article HTML
#   3. Row Summary   — rowwise LLM, one 3-bullet summary per article
#   4. Digest        — aggregate the summaries into a digest
#   5. Render Prompt — diffusion prompt
#   6. Render Image  — first pass
#   7. Critic VLM    — Qwen3-VL critiques the render
#   8. Refined Prompt
#   9. Final Image
#
# Models (all non-gated):
#   text   = Qwen/Qwen3-8B
#   vision = llava-hf/llava-1.5-7b-hf
#   image  = Tongyi-MAI/Z-Image-Turbo
#
# Inputs:  Stock (one symbol per slice; --batch-size 1 is default)
# Output:  final_image  (URL of the refined render)

inputs:
  Stock: []

ops:
  # ---- Stage 1: SQL + S3 retrieval --------------------------------------

  - id: "News Retrieval - SQL"
    op: DataRetrievalOp
    inputs: [Stock]
    data_spec:
      type: sql
      connection_string: ${DATABASE_URL}
      template: |-
        SELECT
          symbol,
          id,
          title,
          "publishedDate" AS published,
          COALESCE(category, 'general') AS category,
          LEFT(COALESCE(summary, text, ''), 300) AS synopsis,
          path
        FROM lumilake_demo.news_metadata
        WHERE symbol = '{symbol}'
          AND id IS NOT NULL
          AND path IS NOT NULL
          AND path <> ''
        ORDER BY "publishedDate" DESC
        LIMIT 5;
      params:
        - label: symbol
          node: "Stock"

  - id: "News Retrieval - S3"
    op: DataRetrievalOp
    inputs: ["News Retrieval - SQL"]
    data_spec:
      type: s3
      connection_string: ${S3_URL}
      template: "example-data/news/html/{id}.html"
      params:
        - label: id
          node: "News Retrieval - SQL"
          path: items.table.id
      encoding: utf-8

  # ---- Stage 2: per-row summary (rowwise LLM) ---------------------------

  - id: "News Row Summary"
    op: LLMChatOp
    inputs: ["News Retrieval - SQL", "News Retrieval - S3"]
    messages:
      - role: system
        content: "You are a financial news analyst. Extract concrete facts and likely market impact."
      - role: user
        content: ""
    rowwise_template: "Summarize one article for {symbol} in 3 compact bullets.\nTitle: {title}\nPublished: {published}\nCategory: {category}\nSynopsis: {synopsis}\nArtifact (truncated): {html}"
    rowwise_columns:
      - label: symbol
        node: "News Retrieval - SQL"
        path: items.table.symbol
      - label: title
        node: "News Retrieval - SQL"
        path: items.table.title
      - label: published
        node: "News Retrieval - SQL"
        path: items.table.published
      - label: category
        node: "News Retrieval - SQL"
        path: items.table.category
      - label: synopsis
        node: "News Retrieval - SQL"
        path: items.table.synopsis
      - label: html
        node: "News Retrieval - S3"
        path: items.content
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 3: aggregate digest ----------------------------------------

  - id: "News Digest"
    op: LLMChatOp
    inputs: [Stock, "News Row Summary"]
    prompt:
      template: "Build a concise investment-focused digest for {ref0} from the per-article summaries.\n\n{df}\n\nReturn sections: Key Signals, Risks, and Visual Priorities."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "You produce structured market digests for downstream visualization."
      - role: user
        content: ""
    aggregate_table:
      - label: summary
        node: "News Row Summary"
        path: items.output
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 4: build a diffusion prompt --------------------------------

  - id: "Render Prompt"
    op: LLMChatOp
    inputs: [Stock, "News Digest"]
    prompt:
      template: "Compose a diffusion prompt for an investment infographic about {ref0} based on the digest below.\n\nDigest:\n{ref1}\n\nReturn exactly:\n- Positive Prompt: ...\n- Negative Prompt: ...\n- Must-Include Facts: 4 bullets"
      format_kwargs:
        ref0: Stock
        ref1: "News Digest"
    messages:
      - role: system
        content: "You build diffusion prompts that balance factual anchoring and visual clarity."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 5: first-pass image render ---------------------------------

  - id: "Render Image"
    op: ImageGenerationOp
    inputs: ["Render Prompt"]
    content: "Render Prompt"
    config:
      model: Tongyi-MAI/Z-Image-Turbo
      max_tokens: 256
      temperature: 0.7
      top_p: 1

  # ---- Stage 6: vision critique -----------------------------------------

  - id: "Critic"
    op: LLMVisionOp
    inputs: ["News Digest", "Render Prompt", "Render Image"]
    image_source: "Render Image"
    image_path: images
    messages:
      - role: system
        content: "You are a visual critic. Score factual alignment and design quality, then list concrete fixes."
      - role: user
        content: ""
    rowwise_template: "Evaluate this rendered infographic.\n\nDigest:\n{News_Digest}\n\nPrompt:\n{Render_Prompt}\n\nReturn: alignment score (1-10), design score (1-10), 3 issues, 3 concrete prompt fixes."
    rowwise_columns:
      - label: News_Digest
        node: "News Digest"
        path: items.output
      - label: Render_Prompt
        node: "Render Prompt"
        path: items.output
    system_messages:
      - "You are a visual critic. Score factual alignment and design quality, then list concrete fixes."
    config:
      model: llava-hf/llava-1.5-7b-hf
      max_tokens: 384
      temperature: 0.2
      top_p: 1

  # ---- Stage 7: refine the prompt --------------------------------------

  - id: "Refined Prompt"
    op: LLMChatOp
    inputs: [Stock, "News Digest", "Render Prompt", "Critic"]
    prompt:
      template: "Refine the diffusion prompt for {ref0} using the critic feedback below.\n\nDigest:\n{ref1}\n\nOriginal Prompt:\n{ref2}\n\nCritic:\n{ref3}\n\nReturn only the refined diffusion prompt text."
      format_kwargs:
        ref0: Stock
        ref1: "News Digest"
        ref2: "Render Prompt"
        ref3: "Critic"
    messages:
      - role: system
        content: "You apply concrete critic feedback to improve the diffusion prompt."
      - role: user
        content: ""
    config:
      model: Qwen/Qwen3-8B
      max_tokens: 768
      temperature: 0.4
      top_p: 1

  # ---- Stage 8: final image render --------------------------------------

  - id: "Final Image"
    op: ImageGenerationOp
    inputs: ["Refined Prompt"]
    content: "Refined Prompt"
    config:
      model: Tongyi-MAI/Z-Image-Turbo
      max_tokens: 256
      temperature: 0.7
      top_p: 1

outputs:
  - name: final_image
    ref: "Final Image"
