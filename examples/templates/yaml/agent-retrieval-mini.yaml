name: agent-retrieval-mini
inputs:
  Stock: []

ops:
  - id: "Fundamentals via Agent"
    op: DataRetrievalOp
    inputs: ["Stock"]
    data_spec:
      type: agent
      output_format: jsonl
      max_steps: 20
      verify: false
      description: "Show me {ref_stock}'s last 5 quarters of fundamentals."
      params:
        - label: ref_stock
          node: Stock

  - id: "One-line Summary"
    op: LLMChatOp
    inputs: [Stock, "Fundamentals via Agent"]
    prompt:
      template: "Write ONE sentence summarizing {ref0}'s recent quarterly results.\n\n{df}\n\nKeep under 30 words."
      format_kwargs:
        ref0: Stock
    messages:
      - role: system
        content: "Concise financial-analyst writing. One sentence only."
      - role: user
        content: ""
    aggregate_table:
      - label: rows
        node: "Fundamentals via Agent"
        path: items.table
      - label: sql
        node: "Fundamentals via Agent"
        path: items.access_chain
    config:
      model: Qwen/Qwen3-32B
      max_tokens: 1024
      temperature: 0.7
      top_p: 1

outputs:
  - name: summary
    ref: "One-line Summary"
