name: Deployment / Installation
description: Report an issue with installing or deploying Lumilake.
title: "[Deploy]: "
labels: ["deployment"]

body:
  - type: markdown
    attributes:
      value: >
        Before submitting, please search
        [existing issues](https://github.com/mlsys-io/lumilake_OSS/issues?q=is%3Aissue+sort%3Acreated-desc+)
        to avoid duplicates.

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Local (uv / pip)
        - Docker Compose (dev)
        - Bundled FlowMesh stack
        - External FlowMesh
        - Other
    validations:
      required: true

  - type: dropdown
    id: data_plane
    attributes:
      label: Data plane
      options:
        - lumid.data
        - Direct PostgreSQL + S3-compatible storage
        - Not configured yet
        - Multiple / unclear
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the issue
      description: |
        What went wrong during installation or deployment?
        Include the commands you ran and the full error output.
      placeholder: |
        Steps to reproduce:
        1. ...

        ```
        Error output
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: >
        Lumilake version/commit, OS, Docker version, Docker Compose version,
        Python version, and runtime/data-plane mode.
      value: |
        - Lumilake version:
        - OS:
        - Docker version:
        - Docker Compose version:
        - Python version:
        - Runtime / data plane:
    validations:
      required: true

  - type: textarea
    attributes:
      label: Relevant config / logs
      description: >
        Paste relevant .env settings with secrets redacted, container status,
        or logs. Use triple-backtick blocks.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
