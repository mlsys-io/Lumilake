name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Create test .env
        run: |
          cat > .env << 'ENVEOF'
          LUMILAKE_SERVER_HOST="127.0.0.1"
          LUMILAKE_SERVER_PORT="9000"
          LUMILAKE_RUNTIME_ORCHESTRATOR_URL="http://127.0.0.1:7000"
          LUMILAKE_RUNTIME_TOKEN=""
          S3_ARCHIVE_PREFIX="test-bucket/archive"
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=lumilake \
            --cov=lumilake_cli \
            --cov=lumilake_deploy \
            --cov=lumilake_hook \
            --cov=lumilake_server \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            if [ -f .coverage ]; then
              uv run coverage report -m || true
            else
              echo "No coverage data file was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
