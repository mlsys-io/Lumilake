name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# RUNNER LANES — policy: deploy_infra k8s-lift/nus-cluster/ci/arc-scaleset-values.yaml
#
# Lumilake is a PUBLIC repo, so the split is by TRUST OF THE TRIGGER, never by repo:
#   * `pull_request` — on a fork this runs the FORK's workflow code — stays on GitHub-hosted
#     runners, which are free and unlimited for a public repo. It must never reach the NUS farm.
#   * `push` to a branch here required write access, so it may use `nus-lumilake` (ARC scale set on
#     NUS s0: 512 cores, 2.2 TiB RAM, warm BuildKit cache).
#
# `vars.NUS_RUNNERS` is the repository-variable kill switch — unset, or anything but `on`, means
# ubuntu-latest everywhere with no code change. The event test is an allowlist, so a new GitHub
# event type cannot silently inherit a self-hosted runner, and both arms are literal labels, so
# the expression can never evaluate to an empty `runs-on` (a job nothing ever picks up).
jobs:
  unit-tests:
    name: Unit tests
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-lumilake' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Create test .env
        run: |
          cat > .env << 'ENVEOF'
          LUMILAKE_SERVER_HOST="127.0.0.1"
          LUMILAKE_SERVER_PORT="9000"
          LUMILAKE_RUNTIME_ORCHESTRATOR_URL="http://127.0.0.1:7000"
          LUMILAKE_RUNTIME_TOKEN=""
          S3_ARCHIVE_PREFIX="test-bucket/archive"
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=lumilake \
            --cov=lumilake_cli \
            --cov=lumilake_deploy \
            --cov=lumilake_hook \
            --cov=lumilake_server \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            if [ -f .coverage ]; then
              uv run coverage report -m || true
            else
              echo "No coverage data file was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
