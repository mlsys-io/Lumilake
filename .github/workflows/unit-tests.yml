name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Create test .env
        run: |
          cat > .env << 'ENVEOF'
          LUMILAKE_OPTIMIZER_TYPE="halo"
          LUMILAKE_SERVER_HOST="127.0.0.1"
          LUMILAKE_SERVER_PORT="9000"
          LUMILAKE_RUNTIME_ORCHESTRATOR_URL="http://127.0.0.1:7000"
          LUMILAKE_RUNTIME_TOKEN=""
          DATABASE_URL=""
          S3_URL=""
          S3_USER_DATA_PREFIX=""
          S3_ARCHIVE_PREFIX="test-bucket/archive"
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=lumilake \
            --cov=lumilake_cli \
            --cov=lumilake_deploy \
            --cov=lumilake_hook \
            --cov=lumilake_server \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            if [ -f .coverage ]; then
              uv run coverage report -m || true
            else
              echo "No coverage data file was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
