name: Package Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-build:
    name: Build and smoke-test packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Install build environment
        run: uv sync --all-packages --all-extras --all-groups --frozen

      - name: Build distributions
        run: uv build --all-packages --out-dir dist

      - name: Verify distributions
        run: uv run scripts/ci/check_package_build.py --dist dist

      - name: Check distribution metadata
        run: uvx twine==6.2.0 check dist/*
