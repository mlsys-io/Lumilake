name: Package Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-build:
    name: Build and smoke-test packages
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.8"
          python-version: "3.12"

      - name: Install build environment
        run: uv sync --all-packages --all-extras --all-groups --frozen

      - name: Build distributions
        run: uv build --all-packages --out-dir dist

      - name: Verify distributions
        run: uv run scripts/ci/check_package_build.py --dist dist

      - name: Check distribution metadata
        run: uvx twine==6.2.0 check dist/*
