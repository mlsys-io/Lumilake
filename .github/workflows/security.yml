name: security

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# RUNNER LANES — policy: deploy_infra k8s-lift/nus-cluster/ci/arc-scaleset-values.yaml
#
# Lumilake is a PUBLIC repo, so the split is by TRUST OF THE TRIGGER, never by repo:
#   * `pull_request` — on a fork this runs the FORK's workflow code — stays on GitHub-hosted
#     runners, which are free and unlimited for a public repo. It must never reach the NUS farm.
#   * `push` to a branch here required write access, so it may use `nus-lumilake` (ARC scale set on
#     NUS s0: 512 cores, 2.2 TiB RAM, warm BuildKit cache).
#
# `vars.NUS_RUNNERS` is the repository-variable kill switch — unset, or anything but `on`, means
# ubuntu-latest everywhere with no code change. The event test is an allowlist, so a new GitHub
# event type cannot silently inherit a self-hosted runner, and both arms are literal labels, so
# the expression can never evaluate to an empty `runs-on` (a job nothing ever picks up).
jobs:
  zizmor:
    name: Zizmor (workflow audit)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-lumilake' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"
      - name: Run zizmor
        run: uvx --from zizmor==1.26.1 zizmor --persona pedantic --format github .github/workflows

  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-lumilake' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --no-git

  bandit:
    name: Bandit (Python source audit)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-lumilake' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"
      - name: Run bandit
        run: |
          uvx bandit==1.9.4 -c pyproject.toml -r \
            src \
            packages/sdk/src \
            packages/cli/src \
            packages/deploy/src \
            packages/hook/src \
            scripts

  pip-audit:
    name: pip-audit (dependency CVE scan)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-lumilake' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"
      - name: Run pip-audit (server image runtime)
        # src/lumilake_server/requirements.txt is the pin set baked into
        # the published Docker image (generated by sync_requirements.py).
        run: uvx pip-audit==2.10.1 --strict -r src/lumilake_server/requirements.txt
      - name: Export wheel install closure
        # PyPI users' install: every extra, no dependency-group (dev/lint/test
        # and server-runtime don't ship in any wheel), no workspace members.
        run: |
          uv export --all-extras --no-default-groups --no-emit-workspace \
            --format requirements-txt --no-hashes > /tmp/wheels-audit.txt
      - name: Run pip-audit (wheel install closure)
        run: uvx pip-audit==2.10.1 --strict -r /tmp/wheels-audit.txt
