name: Release Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and retag :latest, for example v0.1.0.
        required: true
        type: string
      force_latest:
        description: Bypass downgrade-protection guard on the :latest retag.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  FORCE_LATEST: ${{ github.event_name == 'release' && 'false' || inputs.force_latest }}
  LUMILAKE_REGISTRY: ghcr.io/mlsys-io

jobs:
  verify:
    name: Verify published image
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.check.outputs.is_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $RELEASE_TAG is not reachable from origin/main"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.12"

      - name: Install verification environment
        run: uv sync --all-packages --all-extras --all-groups --frozen

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Verify image
        id: check
        run: |
          uv run scripts/ci/check_image_release.py \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --registry "$LUMILAKE_REGISTRY" \
            --markdown-file digest-table.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Job summary
        run: cat digest-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest table
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lumilake-image-digests-${{ env.RELEASE_TAG }}
          path: digest-table.md
          if-no-files-found: error

  retag-latest:
    name: Retag image as :latest
    needs: verify
    if: needs.verify.outputs.is_release_tag == 'true'
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: write  # gh release edit appends the digest table to the Release body
      packages: write  # docker buildx imagetools create writes :latest on GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.12"

      - name: Install retag environment
        run: uv sync --all-packages --all-extras --all-groups --frozen

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :latest
        run: |
          force_args=()
          if [ "$FORCE_LATEST" = "true" ]; then
            force_args+=(--force)
          fi
          uv run scripts/ci/retag_image_release.py \
            --tag "$RELEASE_TAG" \
            --registry "$LUMILAKE_REGISTRY" \
            "${force_args[@]}"

      - name: Download digest table
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lumilake-image-digests-${{ env.RELEASE_TAG }}
          path: .

      - name: Append digest table to Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run scripts/ci/append_release_digests.py \
            --tag "$RELEASE_TAG" \
            --digest-file digest-table.md
