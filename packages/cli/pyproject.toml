[project]
name = "lumilake-cli"
version = "0.1.4"
description = "Lumilake command-line interface"
readme = "README.md"
requires-python = "<3.13,>=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Lumilake contributors"},
]
dependencies = [
    "lumilake-sdk==0.1.4",
    # Renders ``lumilake trace`` ProfileSummary payloads.
    "flowmesh-sdk==0.1.1",
    "requests>=2.32.3",
    "typer>=0.12.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# Thin ``pip install lumilake-cli`` (no extra) skips Docker/FlowMesh.
deploy = ["lumilake-deploy==0.1.4"]

[project.urls]
Homepage = "https://github.com/mlsys-io/lumilake_OSS"
Repository = "https://github.com/mlsys-io/lumilake_OSS"

[project.scripts]
lumilake = "lumilake_cli.cli:main"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
