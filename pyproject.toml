[project]
name = "lumilake"
version = "0.1.4"
description = "Data analytics engine for agentic workflows"
readme = "README.md"
requires-python = "<3.13,>=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Lumilake contributors"},
]
keywords = [
    "agentic-workflows",
    "data-analytics",
    "lakehouse",
    "workflow-orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mlsys-io/lumilake_OSS"
Repository = "https://github.com/mlsys-io/lumilake_OSS"
Issues = "https://github.com/mlsys-io/lumilake_OSS/issues"

[project.optional-dependencies]
sdk = ["lumilake-sdk==0.1.4"]
# Full CLI; pin lumilake-cli alone for the thin variant.
cli = ["lumilake-cli==0.1.4", "lumilake-deploy==0.1.4"]
deploy = ["lumilake-deploy==0.1.4"]
hook = ["lumilake-hook==0.1.4"]
all = [
    "lumilake-sdk==0.1.4",
    "lumilake-cli==0.1.4",
    "lumilake-deploy==0.1.4",
    "lumilake-hook==0.1.4",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Metapackage carries no code. The dist-info-only wheel is intentional.
packages = []

[tool.uv.workspace]
members = [
    "packages/sdk",
    "packages/cli",
    "packages/deploy",
    "packages/hook",
]

[tool.uv.sources]
lumilake-sdk = { workspace = true }
lumilake-cli = { workspace = true }
lumilake-deploy = { workspace = true }
lumilake-hook = { workspace = true }

[tool.uv]
default-groups = []

[dependency-groups]
lint = [
    "black==25.12.0",
    "ruff==0.14.10",
    "mypy==1.20.2",
    "codespell==2.4.2",
    "isort==8.0.1",
    "types-requests==2.33.0.20260503",
    "types-pyyaml==6.0.12.20260408",
    "types-docker==7.1.0.20260409",
    "pre-commit==4.6.0",
]
dev = [
    "ipywidgets>=8.1.5,<9.0.0",
    "pyvis==0.3.1",
    "ipykernel>=6.29.5,<7.0.0",
]
test = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "respx>=0.21.0",
]
# Runtime deps for src/lumilake_server/. Not a project extra — copied
# into the Docker image via `sync_requirements.py --write` so the image
# install pins through uv.lock.
server-runtime = [
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "aiohttp==3.14.3",
    "shortuuid==1.0.13",
    "pandas==3.0.3",
    "dill==0.4.1",
    "sqlparse==0.5.4",
    "lumid-hooks==0.1.0",
    "flowmesh-sdk==0.1.1",
]

[tool.isort]
profile = "black"
skip = [".venv"]

[tool.ruff]
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["I001"]

[tool.black]
force-exclude = "\\.venv"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
    "packages/sdk/src",
    "packages/cli/src",
    "packages/deploy/src",
    "packages/hook/src",
    "src/lumilake_server",
    "scripts",
    "tests",
]

[tool.bandit]
skips = [
    "B101",  # assert: internal invariants, not shipped with -O
    "B102",  # exec: agent Python executor sandbox feature
    "B104",  # 0.0.0.0 bind: containerized; exposure controlled at orchestration
    "B105",  # hardcoded password string: false positives on path / hash-name literals
    "B107",  # password default: placeholder, not a real credential
    "B110",  # try/except/pass: best-effort cleanup paths
    "B112",  # try/except/continue: iteration over partially-bad inputs
    "B307",  # eval: agent Python executor sandbox feature
    "B311",  # random: non-cryptographic sampling / jitter / tie-breaking
    "B403",  # dill import: paired with B301 nosec at the load-site
    "B404",  # subprocess module import: actual unsafe patterns caught by B602/B603/B607
    "B603",  # subprocess call: deploy-time invocations of trusted CLIs (docker, psql, mc)
    "B606",  # start process w/o shell: same context as B603
    "B607",  # start process w/ partial path: deploy CLIs resolved through PATH
    "B608",  # SQL string interpolation: identifiers come from module-level constants
             # and validated quote helpers; values bind via %s.
]

[tool.codespell]
ignore-words-list = ["ans", "assertIn"]
skip = ["*.csv", "tmp*", "./.venv"]

[tool.pyright]
exclude = ["**/__pycache__", "**/.*"]
extraPaths = []
deprecateTypingAliases = true
reportDeprecated = "warning"
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
